name: CI
on:
  merge_group:
  pull_request:
    # The default types for pull_request are [ opened, synchronize, reopened ].
    # This is insufficient for our needs, since we're skipping stuff on PRs in
    # draft mode.  By adding the ready_for_review type, when a draft pr is marked
    # ready, we run everything, including the stuff we'd have skipped up until now.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "website/**"
      - "ui/**"
      # ".github/**" is deliberately NOT ignored on this branch: the point of
      # the branch is to iterate on the FIPS workflows themselves, and ignoring
      # them means a workflow-only change silently never runs.
  push:
    branches:
      - main
      - release/**
      # Probe branch: every push re-runs the FIPS baseline.
      - fips140-build-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}-ci
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    env:
      BASE_SHA: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    outputs:
      go-tags: ""
      checkout-ref: ${{ steps.checkout-ref-output.outputs.checkout-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure Go modules are cached
        uses: ./.github/actions/set-up-go
        with:
          no-restore: true # don't download them on a cache hit
      # control checking out head instead of default ref by a GH label
      # if checkout-head label is added to a PR, checkout HEAD otherwise checkout ref
      - if: ${{ !contains(github.event.pull_request.labels.*.name, 'checkout-head') }}
        run: echo "CHECKOUT_REF=${GITHUB_REF}" >> "$GITHUB_ENV"
      - if: ${{ contains(github.event.pull_request.labels.*.name, 'checkout-head') }}
        run: echo "CHECKOUT_REF=${BASE_SHA}" >> "$GITHUB_ENV"
      - id: checkout-ref-output
        run: echo "checkout-ref=${{ env.CHECKOUT_REF }}" >> "$GITHUB_OUTPUT"

  # NOTE: this branch is a FIPS 140-3 baseline probe, not a merge candidate.
  # The regular `test-go` and `test-go-race` jobs are deliberately absent so
  # that a run reports only what does and does not work under the validated
  # module. Restore them from `main` before turning this into a real PR.

  build-fips:
    name: Build everything against the FIPS module
    needs:
      - setup
    uses: ./.github/workflows/test-fips.yml
    permissions:
      contents: read
    with:
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}

  test-go-fips-on:
    name: Run Go tests in FIPS mode
    needs:
      - setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      contents: read
      actions: write
    with:
      # Mirrors the regular `test-go` job, including the extra runner for the
      # binary-dependent tests, so the baseline is comparable to a normal run.
      binary-tests: true
      total-runners: 16
      go-arch: amd64
      go-tags: "${{ needs.setup.outputs.go-tags }},deadlock"
      runs-on: ubuntu-latest
      name: "fips-on"
      # What a release binary does once an operator sets GODEBUG=fips140=on:
      # approved algorithms go through the module, unapproved ones still work.
      env-vars: '{"GOFIPS140":"v1.26.0","GODEBUG":"fips140=on"}'
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
    secrets: inherit

  test-go-fips-only:
    name: Run Go tests in FIPS-only mode
    needs:
      - setup
    uses: ./.github/workflows/test-go.yml
    permissions:
      contents: read
      actions: write
    with:
      total-runners: 16
      go-arch: amd64
      go-tags: "${{ needs.setup.outputs.go-tags }},deadlock"
      runs-on: ubuntu-latest
      name: "fips-only"
      # The compliance target: unapproved primitives panic or error instead of
      # silently passing through. Expected to be widely red today.
      env-vars: '{"GOFIPS140":"v1.26.0","GODEBUG":"fips140=only"}'
      checkout-ref: ${{ needs.setup.outputs.checkout-ref }}
    secrets: inherit

  # Only the build is gated. The two test jobs are the baseline itself -- they
  # are expected to report failures, and gating on them would just make every
  # run red without saying anything useful.
  tests-completed:
    needs:
      - setup
      - build-fips
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: |
          tr -d '\n' <<< '${{ toJSON(needs.*.result) }}' | grep -q -v -E '(failure|cancelled)'
