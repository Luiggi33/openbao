packages:
  - 'packages/*'
  - 'apps/*'
  - 'lib/*'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  core-js: true
  ember-modal-dialog: true
  fsevents: true
  sinon: true

overrides:
  '@embroider/macros': ^1.19.7
  cryptiles: ^4.1.2
  eslint-utils: ^1.4.1
  ember-basic-dropdown: 8.11.1
  ember-power-select: 8.12.2
  ember-concurrency: 4.0.6
  '@ember/render-modifiers': 3.0.0
  ember-cli-clipboard: 1.3.0
  growl: ^1.10.0
  https-proxy-agent: ^2.2.3
  ini: ^1.3.6
  kind-of: ^6.0.3
  minimatch: ^3.0.2
  prismjs: ^1.21.0
  qs: ^6.14.1
  serialize-javascript: ^3.1.0
  underscore: ^1.12.1
  trim: ^0.0.3
  xmlhttprequest-ssl: ^1.6.2
  cheerio: 1.0.0-rc.12
  get-intrinsic: 1.2.7